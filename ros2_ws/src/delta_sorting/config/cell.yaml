# All distances are metres, angles radians, time seconds of /clock.
robot:
  base_height: 1.17
  home: [0.0, -0.125, -0.300]
  travel_z: -0.295
  joint_speed: 0.85
  joint_acceleration: 2.0
  cartesian_speed: 0.12
  approach_speed: 0.045
  position_tolerance: 0.002
  workspace_radius: 0.185
  z_range: [-0.385, -0.280]
  drive_stiffness: 1500.0
  drive_damping: 30.0
  max_torque: 15.0
conveyor:
  top: 0.80
  length: 3.4
  width: 0.13
  speed: 0.065
  pick_x: [-0.095, 0.095]
  pick_y: [-0.045, 0.045]
caps:
  radius: 0.014
  height: 0.012
  mass: 0.0022
  friction: 0.45
  spacing: 0.12
  count: 24
  seed: 17
  colors:
    red: [0.8, 0.012, 0.008]
    blue: [0.008, 0.05, 0.85]
    green: [0.01, 0.65, 0.035]
    yellow: [0.95, 0.7, 0.008]
camera:
  position: [0.0, 0.0, 1.10]
  # USD camera looks along -Z, +Y up. ROS optical frame is a pi rotation about X.
  width: 640
  height: 480
  focal_length_mm: 12.0
  horizontal_aperture_mm: 16.0
  frame_rate: 10
perception:
  min_area: 300.0
  max_area: 3200.0
  min_circularity: 0.77
  min_solidity: 0.93
  min_confidence: 0.80
  min_saturation: 95
  min_value: 55
  # OpenCV hue 0..179. Two bands cover red across hue wraparound.
  hue_ranges:
    red: [[0, 10], [170, 179]]
    blue: [[100, 135]]
    green: [[40, 85]]
    yellow: [[20, 37]]
bins:
  red: [-0.060, 0.110]
  blue: [0.060, 0.110]
  green: [-0.060, -0.110]
  yellow: [0.060, -0.110]
bin_geometry:
  inner_width: 0.075
  floor: 0.730
  rim: 0.820
  release_z: -0.305
task:
  autostart: true
  settle_time: 0.6
  detection_timeout: 3.0
  operation_timeout: 16.0
  max_attempts: 24
  max_pick_retries: 1
  empty_feed_timeout: 55.0
simulation:
  physics_dt: 0.004166666666666667
  render_dt: 0.05
  solver_position_iterations: 64
  solver_velocity_iterations: 8
  max_time: 1000.0
